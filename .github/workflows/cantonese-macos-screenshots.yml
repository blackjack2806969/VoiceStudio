name: Cantonese macOS v0.3.0 release screenshots
on:
  push:
    branches: [cantonese-release-evidence/0.3.0]
    paths: ['.github/workflows/cantonese-macos-screenshots.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RELEASE_TAG: cantonese-macos-0.3.0
  BUILD_RUN: '46122737504'

jobs:
  screenshots:
    if: github.repository == 'blackjack2806969/VoiceStudio'
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Retrieve the verified release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          run=$(gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch,conclusion)
          test "$(jq -r .headSha <<< "$run")" = "$sha"
          test "$(jq -r .headBranch <<< "$run")" = "$RELEASE_TAG"
          test "$(jq -r .conclusion <<< "$run")" = success
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" \
            --name Cantonese-Voice-Studio-macOS-arm64 --dir "$RUNNER_TEMP/installers"
          shopt -s nullglob
          dmgs=("$RUNNER_TEMP"/installers/*.dmg)
          test "${#dmgs[@]}" = 1
          mount="$RUNNER_TEMP/cantonese-dmg"
          mkdir -p "$mount" electron/release/mac-arm64
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${dmgs[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/VoiceStudio.app" "electron/release/mac-arm64/VoiceStudio.app"
      - name: Exercise the installed app and capture all five workspaces
        run: |
          bun install --frozen-lockfile
          node electron/tests/cantonese-packaged-smoke.mjs
          test "$(find artifacts/cantonese/packaged -name 'ui-*.png' | wc -l | tr -d ' ')" = 5
      - name: Retain the actual macOS screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Cantonese-Voice-Studio-v0.3.0-UI
          path: artifacts/cantonese/packaged/ui-*.png
          if-no-files-found: error
      - name: Retain the failure screen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Cantonese-v0.3.0-screenshot-diagnostics
          path: artifacts/cantonese/packaged/*.png
          if-no-files-found: ignore

  publish-screenshots:
    needs: screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Cantonese-Voice-Studio-v0.3.0-UI
          path: screenshots
      - name: Attach the five screenshots to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" screenshots/ui-*.png
