name: Cantonese real offline TTS
on:
  workflow_dispatch:
  push:
    branches: [cantonese-offline]
    paths:
      - '.github/workflows/cantonese-tts-smoke.yml'
      - 'scripts/smoke_cantonese_tts.py'
permissions:
  contents: read
jobs:
  real-model:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Prepare existing pinned engine and public weights
        run: |
          test "$(uname -m)" = arm64
          uv sync --frozen --no-dev --no-editable --no-install-project --python 3.11
          .venv/bin/python scripts/prepare_cantonese_models.py --download --data-dir "$RUNNER_TEMP/cantonese-data"
      - name: Synthesize with network access denied
        run: |
          /usr/bin/sandbox-exec -f packaging/cantonese/offline.sb .venv/bin/python scripts/check_cantonese_sandbox.py
          /usr/bin/sandbox-exec -f packaging/cantonese/offline.sb .venv/bin/python scripts/smoke_cantonese_tts.py --data-dir "$RUNNER_TEMP/cantonese-data" --output artifacts/cantonese/tts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Cantonese-offline-TTS-audio
          path: artifacts/cantonese/tts
          if-no-files-found: warn
          retention-days: 14
