name: Cantonese offline macOS ARM64
on:
  workflow_dispatch:
  push:
    branches: [cantonese-offline, cantonese-release-evidence/0.3.0]
    tags: ['cantonese-macos-*']
    paths:
      - 'backend/**'
      - 'electron/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'bun.lock'
      - 'tests/test_lexical_pitch*.py'
      - 'tests/test_cantonese_offline.py'
      - '.github/workflows/cantonese-macos.yml'
permissions:
  contents: read
env:
  CANDIDATE_TAG: ${{ github.ref == 'refs/heads/cantonese-release-evidence/0.3.0' && 'cantonese-macos-0.3.0' || '' }}
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VOICESTUDIO_RUST_TARGET: aarch64-apple-darwin
      VOICESTUDIO_CANTONESE_BUILD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_TAG != '' && format('refs/tags/{0}', env.CANDIDATE_TAG) || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: '0.12.13'
          enable-cache: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: aarch64-apple-darwin
      - name: Install and stage the existing Python runtime and local ffmpeg
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          test "$(uname -m)" = arm64
          uv sync --frozen --no-dev --no-editable --no-install-project --python 3.11
          .venv/bin/python scripts/stage_mas_python.py --python .venv/bin/python --lock uv.lock --output electron/build/python-runtime
          .venv/bin/python scripts/stage_mas_media.py --download --output electron/build/media-tools
      - name: Verify audio and offline networking
        env:
          HF_HUB_OFFLINE: '1'
          HF_HUB_CACHE: ${{ runner.temp }}/empty-hf
        run: |
          uv pip install pytest httpx
          export PATH="$PWD/electron/build/media-tools:$PATH"
          .venv/bin/python -m pytest tests/test_lexical_pitch.py tests/test_lexical_pitch_api.py tests/test_cantonese_offline.py -q
          /usr/bin/sandbox-exec -f packaging/cantonese/offline.sb .venv/bin/python scripts/check_cantonese_sandbox.py
      - name: Build and test the existing Electron UI
        run: |
          bun install --frozen-lockfile
          (ulimit -n 128; node electron/tests/cantonese-sign-walk.test.mjs)
          bun run --cwd electron typecheck
          cd electron
          bun x vitest run src/renderer/src/features/tools/lexical-pitch.test.tsx src/main/cantonese-offline.test.ts src/main/ipc-registry.test.ts src/renderer/src/hooks/use-tts-readiness.test.tsx
          bun run build
          bun run build:web
          bun x electron-builder --config electron-builder.config.mjs --mac --arm64 --publish never
      - name: Retrieve the release acceptance scripts
        if: env.CANDIDATE_TAG != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: release-acceptance
          sparse-checkout: |
            electron/tests/cantonese-packaged-smoke.mjs
            electron/tests/cantonese-tone-flow.mjs
          sparse-checkout-cone-mode: false
      - name: Install the candidate from its DMG for acceptance
        if: env.CANDIDATE_TAG != ''
        run: |
          git show -s --format='Candidate commit %H'
          cp release-acceptance/electron/tests/cantonese-*.mjs electron/tests/
          shopt -s nullglob
          dmgs=(electron/release/*.dmg)
          test "${#dmgs[@]}" = 1
          mount="$RUNNER_TEMP/cantonese-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${dmgs[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          test_app="$RUNNER_TEMP/VoiceStudio.app"
          ditto "$mount/VoiceStudio.app" "$test_app"
          echo "CANTONESE_SMOKE_EXECUTABLE=$test_app/Contents/MacOS/cantonese-offline" >> "$GITHUB_ENV"
      - name: Verify packaged OmniVoice, focused navigation and pitch editing
        run: node electron/tests/cantonese-packaged-smoke.mjs
      - name: Retain packaged test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Cantonese-packaged-test-evidence
          path: artifacts/cantonese/packaged
          if-no-files-found: warn
      - name: Retain downloadable DMG and app ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Cantonese-Voice-Studio-macOS-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            electron/release/*.dmg
            electron/release/*arm64*.zip
  publish:
    if: github.repository == 'blackjack2806969/VoiceStudio' && (startsWith(github.ref, 'refs/tags/cantonese-macos-') || github.ref == 'refs/heads/cantonese-release-evidence/0.3.0')
    needs: macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Cantonese-Voice-Studio-macOS-arm64
          path: installers
      - if: env.CANDIDATE_TAG != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Cantonese-packaged-test-evidence
          path: screenshots
      - name: Publish the verified macOS ARM64 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          images=(screenshots/ui-*.png)
          if [[ -n "$CANDIDATE_TAG" ]]; then test "${#images[@]}" = 5; fi
          gh release create "${CANDIDATE_TAG:-$GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Cantonese Voice Studio for macOS — Voice Production" \
            --notes-file - installers/*.dmg installers/*arm64*.zip "${images[@]}" <<'NOTES'
          Open **Clone** to download about 2.4 GB of OmniVoice weights or reuse the original app’s Hugging Face cache. The OmniVoice weights are for non-commercial use and the audio tokenizer has separate terms. Review the disclosures in Clone.

          The app has five workspaces: Clone, Cantonese Pitch Editor, Saved Voices, History and Settings. Use **Edit Pitch** beside a take in Clone or History to open that audio directly in the editor.

          The macOS ARM64 CI test verified model setup, offline cloning, both Edit Pitch actions, playback, undo and WAV export. The app uses ad-hoc signing and has no Developer ID notarization.
          NOTES
